# Firmware is built and flashed on the host that has ESP-IDF and the M5Stack (default: wvx).
#   mise run fw:build
#   mise run fw:flash
#   mise run fw:monitor
# Wi-Fi is configured over BLE from this machine.
#   mise run ble:status
#   mise run ble:wifi-set

[env]
BUILD_HOST = "{{ get_env(name='BUILD_HOST', default='wvx') }}"
IDF_EXPORT = "~/esp/esp-idf-v6.1/export.sh"
SERIAL_PORT = "{{ get_env(name='SERIAL_PORT', default='/dev/ttyUSB0') }}"
REMOTE_DIR = "logbo"

[tasks."fw:sync"]
description = "rsync firmware/ to $BUILD_HOST:$REMOTE_DIR/"
run = """
rsync -a --delete --exclude 'build*' --exclude sdkconfig --exclude sdkconfig.old --exclude managed_components \
  firmware/ $BUILD_HOST:$REMOTE_DIR/
"""

[tasks."fw:build"]
description = "Build on $BUILD_HOST"
depends = ["fw:sync"]
run = "ssh $BUILD_HOST \". $IDF_EXPORT >/dev/null 2>&1; cd ~/$REMOTE_DIR && idf.py build\""

[tasks."fw:flash"]
description = "Build and flash to $SERIAL_PORT on $BUILD_HOST"
depends = ["fw:sync"]
run = "ssh $BUILD_HOST \". $IDF_EXPORT >/dev/null 2>&1; cd ~/$REMOTE_DIR && idf.py -p $SERIAL_PORT build flash\""

[tasks."fw:monitor"]
description = "Serial monitor on $BUILD_HOST (Ctrl-] to quit)"
run = "ssh -t $BUILD_HOST \". $IDF_EXPORT >/dev/null 2>&1; cd ~/$REMOTE_DIR && idf.py -p $SERIAL_PORT monitor\""

[tasks."fw:test"]
description = "Run the host unit tests on $BUILD_HOST"
depends = ["fw:sync"]
run = "ssh $BUILD_HOST \". $IDF_EXPORT >/dev/null 2>&1; cd ~/$REMOTE_DIR/test/host && cmake -S . -B build >/dev/null && cmake --build build && ./build/test_gnss\""

[tasks."fw:ap"]
description = "Show the soft-AP SSID/password of the last build (new on every build)"
run = "ssh $BUILD_HOST \"cat ~/$REMOTE_DIR/build/esp-idf/main/ap_credentials.h\""

[tasks."ble:status"]
description = "Show GNSS / SD / Wi-Fi state of the logger over BLE"
run = "uv run tools/ble-config.py status"

[tasks."ble:wifi-set"]
description = "Set Wi-Fi SSID/password over BLE (prompts)"
run = "uv run tools/ble-config.py wifi-set"

[tasks."udp:dump"]
description = "Show the UDP broadcast (summary per line); `mise run udp:dump -- -raw` for JSON"
dir = "client"
run = "go run . "
